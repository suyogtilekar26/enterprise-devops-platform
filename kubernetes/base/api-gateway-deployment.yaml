apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  namespace: enterprise-dev
  labels:
    app: api-gateway
    project: enterprise-devops-platform
    environment: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-gateway

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: api-gateway
        project: enterprise-devops-platform
        environment: dev

    spec:
      containers:
      - name: api-gateway

        image: enterprise-devops-platform-api-gateway:v1.0.0
        imagePullPolicy: IfNotPresent

        envFrom:
        - configMapRef:
            name: enterprise-config

        ports:
        - containerPort: 8080
          name: http
          protocol: TCP

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "250m"
            memory: "256Mi"
