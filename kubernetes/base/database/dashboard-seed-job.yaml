apiVersion: batch/v1
kind: Job

metadata:
  name: dashboard-seed
  namespace: enterprise-dev

spec:
  template:
    spec:
      restartPolicy: Never

      containers:
      - name: seed

        image: enterprise-devops-platform-dashboard-service:v2.0.0
        imagePullPolicy: IfNotPresent

        command:
        - python
        - seed_dashboard.py

        envFrom:
        - configMapRef:
            name: enterprise-config

        env:
        - name: DATABASE_HOST
          value: postgres-service

        - name: DATABASE_PORT
          value: "5432"

        - name: DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB

        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER

        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
