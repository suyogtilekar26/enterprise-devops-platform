cat <<'EOF' > .github/workflows/ci.yml
name: Enterprise CI

on:
  push:
    branches:
      - develop
      - "feature/**"

  pull_request:
    branches:
      - develop

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Development Tools
        run: pip install -r requirements-dev.txt

      - name: Run Flake8
        run: |
          flake8 api-gateway
          flake8 auth-service
          flake8 dashboard-service

      - name: Run Black
        run: |
          black --check api-gateway
          black --check auth-service
          black --check dashboard-service

  build:
    name: Build and Validate
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Install API Gateway Dependencies
        working-directory: api-gateway
        run: pip install -r requirements.txt

      - name: Install Auth Service Dependencies
        working-directory: auth-service
        run: pip install -r requirements.txt

      - name: Install Dashboard Service Dependencies
        working-directory: dashboard-service
        run: pip install -r requirements.txt

  docker:
    name: Docker Image Build
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build API Gateway Image
        run: docker build -t api-gateway:ci ./api-gateway

      - name: Build Auth Service Image
        run: docker build -t auth-service:ci ./auth-service

      - name: Build Dashboard Service Image
        run: docker build -t dashboard-service:ci ./dashboard-service

      - name: Build Frontend Image
        run: docker build -t frontend:ci ./frontend
EOF