# -------------------------------------------------------------------
# SonarCloud Project Configuration
# -------------------------------------------------------------------

sonar.projectKey=suyogtilekar26_enterprise-devops-platform
sonar.organization=suyogtilekar26

# -------------------------------------------------------------------
# Source Code
# -------------------------------------------------------------------

sonar.sources=frontend/src,api-gateway,auth-service,dashboard-service

# -------------------------------------------------------------------
# Encoding
# -------------------------------------------------------------------

sonar.sourceEncoding=UTF-8

# -------------------------------------------------------------------
# Python Coverage
# -------------------------------------------------------------------

sonar.python.coverage.reportPaths=\
api-gateway/coverage.xml,\
auth-service/coverage.xml,\
dashboard-service/coverage.xml

# -------------------------------------------------------------------
# Exclusions
# -------------------------------------------------------------------

sonar.exclusions=\
**/__pycache__/**,\
**/.pytest_cache/**,\
**/.venv/**,\
**/node_modules/**,\
**/dist/**,\
**/build/**,\
**/*.min.js

# -------------------------------------------------------------------
# Test Exclusions
# -------------------------------------------------------------------

sonar.test.exclusions=\
**/tests/**

