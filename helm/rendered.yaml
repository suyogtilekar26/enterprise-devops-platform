# Source: enterprise-platform/templates/postgres-deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: enterprise-dev

  labels:
    app: postgres
    project: enterprise-devops-platform

spec:

  replicas: 1

  selector:

    matchLabels:
      app: postgres


  template:

    metadata:

      labels:
        app: postgres


    spec:

      containers:


        - name: postgres-storage

          mountPath: /var/lib/postgresql/data


      volumes:

      - name: postgres-storage

        persistentVolumeClaim:

          claimName: postgres-pvc
---
# Source: enterprise-platform/templates/auth-seed-job.yaml
apiVersion: batch/v1
kind: Job

metadata:
  name: auth-seed
  namespace: enterprise-dev

spec:

  template:

    spec:

      restartPolicy: Never


      containers:

      - name: seed

        image: enterprise-devops-platform-auth-service:v2.0.0

        imagePullPolicy: IfNotPresent


        command:

        - python

        - seed_database.py


        envFrom:

        - configMapRef:
            name: enterprise-config


        - secretRef:
            name: enterprise-secrets


        env:

        - name: DATABASE_HOST

          value: postgres-service


        - name: DATABASE_PORT

          value: "5432"


        - name: DATABASE_NAME

          valueFrom:

            secretKeyRef:

              name: postgres-secret

              key: POSTGRES_DB


        - name: DATABASE_USER

          valueFrom:

            secretKeyRef:

              name: postgres-secret

              key: POSTGRES_USER


        - name: DATABASE_PASSWORD

          valueFrom:

            secretKeyRef:

              name: postgres-secret

              key: POSTGRES_PASSWORD
---
