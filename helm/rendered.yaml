# Source: enterprise-platform/templates/api-gateway-deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  namespace: enterprise-dev

  labels:
    app: api-gateway
    project: enterprise-devops-platform


spec:

  replicas: 2


  selector:

    matchLabels:
      app: api-gateway


  template:

    metadata:

      labels:
        app: api-gateway


    spec:

      containers:

      - name: api-gateway

        image: enterprise-devops-platform-api-gateway:v1.0.0

        imagePullPolicy: IfNotPresent


        ports:

        - containerPort: 8080


        envFrom:

        - configMapRef:
            name: enterprise-config


        env:

        - name: AUTH_SERVICE_URL

          value: http://auth-service


        - name: DASHBOARD_SERVICE_URL

          value: http://dashboard-service
---
# Source: enterprise-platform/templates/auth-service-deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: enterprise-dev

  labels:
    app: auth-service
    project: enterprise-devops-platform


spec:

  replicas: 2


  selector:

    matchLabels:
      app: auth-service


  template:

    metadata:

      labels:
        app: auth-service


    spec:

      containers:

      - name: auth-service

        image: enterprise-devops-platform-auth-service:v2.0.0

        imagePullPolicy: IfNotPresent


        ports:

        - containerPort: 5000


        envFrom:

        - configMapRef:
            name: enterprise-config


        - secretRef:
            name: enterprise-secrets


        env:

        - name: DATABASE_HOST

          value: postgres-service


        - name: DATABASE_PORT

          value: "5432"


        - name: DATABASE_NAME

          valueFrom:

            secretKeyRef:

              name: postgres-secret

              key: POSTGRES_DB


        - name: DATABASE_USER

          valueFrom:

            secretKeyRef:

              name: postgres-secret

              key: POSTGRES_USER


        - name: DATABASE_PASSWORD

          valueFrom:

            secretKeyRef:

              name: postgres-secret

              key: POSTGRES_PASSWORD
