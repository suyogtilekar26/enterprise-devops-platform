---
# Source: enterprise-platform/templates/namespace.yaml
apiVersion: v1
kind: Namespace

metadata:
  name: enterprise-dev

  labels:
    project: enterprise-devops-platform
    environment: dev
---
# Source: enterprise-platform/templates/postgres-secret.yaml
apiVersion: v1
kind: Secret

metadata:
  name: postgres-secret
  namespace: enterprise-dev

type: Opaque

stringData:

  POSTGRES_DB: enterprise_db

  POSTGRES_USER: enterprise_user

  POSTGRES_PASSWORD: enterprise_password
---
# Source: enterprise-platform/templates/secrets.yaml
apiVersion: v1
kind: Secret

metadata:
  name: enterprise-secrets
  namespace: enterprise-dev

type: Opaque

stringData:

  SECRET_KEY: "change-this-secret-key"

  JWT_SECRET_KEY: "change-this-jwt-secret-key"
---
# Source: enterprise-platform/templates/postgres-pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: postgres-pvc
  namespace: enterprise-dev

spec:

  accessModes:
    - ReadWriteOnce

  resources:

    requests:
      storage: 1Gi
---
